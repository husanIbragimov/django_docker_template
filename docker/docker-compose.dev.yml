# Dev stack = the full prod stack (included as-is, no duplication) + nginx serving static/media.
include:
  - path: docker-compose.prod.yml
    env_file: ../.envs/.env

services:
  nginx:
    image: nginx:1.27
    container_name: template_nginx
    networks:
      - shared_network
    ports:
      - "8000:80"
    volumes:
      - ./.conf/docker-nginx.conf:/etc/nginx/nginx.conf:ro
      - ./../static:/app/static:ro
      - ./../media:/app/media:ro
    depends_on:
      - web
