{% extends "base.html" %}

{% block title %}Forbidden (403){% endblock title %}
{% block content %}
  <p class="status-code">403</p>
  <h1>Forbidden</h1>
  <p>
    {% if exception %}
      {{ exception }}
    {% else %}
      You're not allowed to access this page.
    {% endif %}
  </p>
  <a class="btn" href="/">Go to homepage</a>
{% endblock content %}
