{% extends "base.html" %}

{% block title %}Page not found (404){% endblock title %}
{% block content %}
  <p class="status-code">404</p>
  <h1>Page not found</h1>
  <p>
    {% if exception %}
      {{ exception }}
    {% else %}
      This is not the page you were looking for.
    {% endif %}
  </p>
  <a class="btn" href="/">Go to homepage</a>
{% endblock content %}
